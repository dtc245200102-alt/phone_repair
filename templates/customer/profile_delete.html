{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width: 600px;">

    <div class="bg-white rounded-4 shadow-sm p-5 text-center">

        <div
            class="mx-auto mb-4 d-flex align-items-center justify-content-center"
            style="
                width:80px;
                height:80px;
                border-radius:50%;
                background:#fff1f1;
                color:#dc3545;
                font-size:38px;
            "
        >
            <i class="bi bi-exclamation-triangle"></i>
        </div>


        <h2 class="text-danger">
            Xóa tài khoản?
        </h2>


        <p class="text-muted mt-3">
            Bạn có chắc chắn muốn xóa tài khoản không?
        </p>

        <p class="text-muted">
            Sau khi xóa, bạn sẽ không thể đăng nhập lại bằng tài khoản này.
            Thao tác này không thể hoàn tác.
        </p>


        <div class="d-flex justify-content-center gap-2 mt-4">

            <a
                href="{% url 'accounts:customer_profile' %}"
                class="btn btn-light rounded-pill px-4"
            >
                Hủy
            </a>


            <form
                method="post"
                action="{% url 'accounts:customer_delete_account' %}"
            >

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger rounded-pill px-4"
                >
                    <i class="bi bi-trash me-1"></i>
                    Xác nhận xóa
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
